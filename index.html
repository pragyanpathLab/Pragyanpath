<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pragyanpath</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f7f6f4; --bg-sidebar:#fafaf9; --border:#e7e5e2;
    --text:#1f1e1c; --text-dim:#6b6a67; --accent:#b45f4d; --accent-hover:#9c4f40;
    --bubble-user:#f0eeea; --bubble-ai:transparent; --code-bg:#282623;
  }
  html.dark{
    --bg:#1a1a19; --bg-soft:#232221; --bg-sidebar:#1f1e1d; --border:#33322f;
    --text:#eae8e4; --text-dim:#9b9a96; --accent:#d97757; --accent-hover:#e8896a;
    --bubble-user:#2b2a28; --bubble-ai:transparent; --code-bg:#141312;
  }
  html,body{background:var(--bg); color:var(--text);}
  * { box-sizing: border-box; }
  body{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .app-shell{ height: 100dvh; height: 100vh; }
  #loading{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#1a1a19; color:#eae8e4; gap:14px; z-index:9999;
  }
  .spinner{ width:34px; height:34px; border-radius:50%; border:3px solid #3a3936; border-top-color:#d97757; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .sidebar{ background:var(--bg-sidebar); border-right:1px solid var(--border); transition: transform 0.25s ease; }
  .chat-item{ border:1px solid transparent; }
  .chat-item:hover{ background:var(--bg-soft); }
  .chat-item.active{ background:var(--bubble-user); }

  .msg-bubble-user{ background:var(--bubble-user); border-radius:16px; }
  .msg-content{ line-height:1.65; word-wrap:break-word; }
  .msg-content p{ margin:0 0 0.75em 0; }
  .msg-content p:last-child{ margin-bottom:0; }
  .msg-content ul, .msg-content ol{ margin:0 0 0.75em 1.25em; }
  .msg-content pre{
    background:var(--code-bg); color:#f2f0ec; padding:12px 14px; border-radius:10px;
    overflow-x:auto; font-size:13px; margin:0.5em 0; position:relative;
  }
  .msg-content code{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .msg-content :not(pre) > code{
    background:var(--bg-soft); padding:2px 5px; border-radius:5px; font-size:0.9em; border:1px solid var(--border);
  }
  .code-copy-btn{
    position:absolute; top:6px; right:6px; font-size:11px; padding:3px 8px; border-radius:6px;
    background:rgba(255,255,255,0.12); color:#eee; border:none; cursor:pointer;
  }
  .code-copy-btn:hover{ background:rgba(255,255,255,0.22); }

  textarea::-webkit-scrollbar, .scroll-thin::-webkit-scrollbar{ width:8px; height:8px; }
  textarea::-webkit-scrollbar-thumb, .scroll-thin::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }

  .cursor-blink::after{
    content:'▍'; display:inline-block; margin-left:2px; animation:blink 1s step-start infinite; color:var(--accent);
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .modal-backdrop{ background:rgba(0,0,0,0.45); }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-primary:hover{ background:var(--accent-hover); }
  .icon-btn:hover{ background:var(--bg-soft); }

  @media (max-width: 767px){
    .sidebar{ position:fixed; top:0; left:0; bottom:0; width:82%; max-width:300px; z-index:40; transform:translateX(-100%); }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:30; }
  }
</style>
</head>
<body class="h-full">

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:13px; letter-spacing:0.3px; color:#b9b7b2;">Loading Pragyanpath…</div>
</div>

<div id="app" class="hidden app-shell flex" style="display:none;">

  <div id="sidebarBackdrop" class="sidebar-backdrop hidden md:hidden"></div>

  <aside id="sidebar" class="sidebar flex flex-col w-[260px] shrink-0 h-full">
    <div class="p-3 flex items-center gap-2">
      <button id="newChatBtn" class="flex-1 flex items-center gap-2 px-3 py-2 rounded-lg border text-sm font-medium"
        style="border-color:var(--border);">
        <span>＋</span><span>New chat</span>
      </button>
      <button id="closeSidebarBtn" class="md:hidden icon-btn p-2 rounded-lg" style="color:var(--text-dim);">✕</button>
    </div>
    <div id="chatList" class="flex-1 overflow-y-auto scroll-thin px-2 space-y-1 pb-2"></div>
    <div class="p-3 border-t" style="border-color:var(--border);">
      <button id="openSettingsBtn" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm icon-btn" style="color:var(--text-dim);">
        <span>⚙</span><span>Settings</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 h-full">
    <header class="flex items-center gap-2 px-3 py-2.5 border-b shrink-0" style="border-color:var(--border);">
      <button id="hamburgerBtn" class="md:hidden icon-btn p-2 rounded-lg" style="color:var(--text-dim);">☰</button>
      <div class="flex-1 min-w-0">
        <div id="chatTitle" class="text-sm font-medium truncate">New chat</div>
        <div id="modelLabel" class="text-xs truncate" style="color:var(--text-dim);"></div>
      </div>
      <button id="darkToggleBtn" class="icon-btn p-2 rounded-lg text-sm" style="color:var(--text-dim);">🌙</button>
      <button id="sysPromptBtn" class="icon-btn p-2 rounded-lg text-sm" style="color:var(--text-dim);" title="System prompt">🧠</button>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto scroll-thin px-3 md:px-0">
      <div class="max-w-2xl mx-auto py-6 space-y-6" id="messagesInner"></div>
    </div>

    <div class="border-t shrink-0" style="border-color:var(--border);">
      <div class="max-w-2xl mx-auto px-3 py-3" style="padding-bottom: max(12px, env(safe-area-inset-bottom));">
        <div id="apiKeyWarning" class="hidden text-xs mb-2 px-3 py-2 rounded-lg" style="background:var(--bg-soft); color:var(--text-dim);">
          Add your OpenRouter API key in Settings (⚙) to start chatting.
        </div>
        <div class="flex items-end gap-2 rounded-2xl border px-3 py-2" style="border-color:var(--border);">
          <textarea id="inputBox" rows="1" placeholder="Message Pragyanpath…"
            class="flex-1 resize-none bg-transparent outline-none text-sm max-h-40 py-1.5"></textarea>
          <button id="sendBtn" class="btn-primary rounded-xl px-3 py-1.5 text-sm font-medium shrink-0">Send</button>
        </div>
        <div class="text-[11px] text-center mt-2" style="color:var(--text-dim);">Pragyanpath can make mistakes. Verify important information.</div>
      </div>
    </div>
  </main>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
  <div class="rounded-2xl w-full max-w-md p-5" style="background:var(--bg); border:1px solid var(--border);">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold">Settings</h2>
      <button id="closeSettingsBtn" class="icon-btn p-1.5 rounded-lg" style="color:var(--text-dim);">✕</button>
    </div>
    <div class="space-y-4">
      <div>
        <label class="text-xs font-medium block mb-1.5" style="color:var(--text-dim);">OpenRouter API Key</label>
        <input id="apiKeyInput" type="password" placeholder="sk-or-v1-…"
          class="w-full px-3 py-2 rounded-lg border text-sm bg-transparent outline-none" style="border-color:var(--border);">
      </div>
      <div>
        <label class="text-xs font-medium block mb-1.5" style="color:var(--text-dim);">Model</label>
        <input id="modelInput" type="text" placeholder="deepseek/deepseek-r1:free"
          class="w-full px-3 py-2 rounded-lg border text-sm bg-transparent outline-none" style="border-color:var(--border);">
      </div>
      <p class="text-[11px]" style="color:var(--text-dim);">Stored only in this browser's local storage. Never sent anywhere except directly to OpenRouter.</p>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button id="cancelSettingsBtn" class="px-3 py-1.5 rounded-lg text-sm" style="color:var(--text-dim);">Cancel</button>
      <button id="saveSettingsBtn" class="btn-primary px-4 py-1.5 rounded-lg text-sm font-medium">Save</button>
    </div>
  </div>
</div>

<!-- System Prompt Modal -->
<div id="sysPromptModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
  <div class="rounded-2xl w-full max-w-md p-5" style="background:var(--bg); border:1px solid var(--border);">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold">System prompt</h2>
      <button id="closeSysPromptBtn" class="icon-btn p-1.5 rounded-lg" style="color:var(--text-dim);">✕</button>
    </div>
    <div class="space-y-3">
      <textarea id="sysPromptGlobalInput" rows="3" placeholder="Global default instructions for every chat…"
        class="w-full px-3 py-2 rounded-lg border text-sm bg-transparent outline-none resize-none" style="border-color:var(--border);"></textarea>
      <div>
        <label class="text-xs font-medium block mb-1.5" style="color:var(--text-dim);">Override for this chat only (optional)</label>
        <textarea id="sysPromptChatInput" rows="3" placeholder="Leave blank to use the global prompt…"
          class="w-full px-3 py-2 rounded-lg border text-sm bg-transparent outline-none resize-none" style="border-color:var(--border);"></textarea>
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
      <button id="cancelSysPromptBtn" class="px-3 py-1.5 rounded-lg text-sm" style="color:var(--text-dim);">Cancel</button>
      <button id="saveSysPromptBtn" class="btn-primary px-4 py-1.5 rounded-lg text-sm font-medium">Save</button>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div id="renameModal" class="fixed inset-0 modal-backdrop hidden items-center justify-center z-50 p-4">
  <div class="rounded-2xl w-full max-w-sm p-5" style="background:var(--bg); border:1px solid var(--border);">
    <h2 class="text-base font-semibold mb-4">Rename chat</h2>
    <input id="renameInput" type="text" class="w-full px-3 py-2 rounded-lg border text-sm bg-transparent outline-none" style="border-color:var(--border);">
    <div class="flex justify-end gap-2 mt-5">
      <button id="cancelRenameBtn" class="px-3 py-1.5 rounded-lg text-sm" style="color:var(--text-dim);">Cancel</button>
      <button id="saveRenameBtn" class="btn-primary px-4 py-1.5 rounded-lg text-sm font-medium">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- Constants ---------- */
  var OPENROUTER_URL = "https://openrouter.ai/api/v1/chat/completions";
  var LS_KEYS = {
    apiKey: "pragyanpath_apiKey",
    model: "pragyanpath_model",
    chats: "pragyanpath_chats",
    currentChatId: "pragyanpath_currentChatId",
    darkMode: "pragyanpath_darkMode",
    sysPromptGlobal: "pragyanpath_sysPromptGlobal"
  };
  var DEFAULT_MODEL = "deepseek/deepseek-r1:free";

  /* ---------- Safe localStorage helpers ---------- */
  function lsGet(key, fallback){
    try{
      var v = window.localStorage.getItem(key);
      return v === null ? fallback : v;
    }catch(e){ return fallback; }
  }
  function lsSet(key, value){
    try{ window.localStorage.setItem(key, value); }catch(e){ console.warn("localStorage set failed", e); }
  }
  function lsGetJSON(key, fallback){
    try{
      var v = window.localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    }catch(e){ return fallback; }
  }
  function lsSetJSON(key, obj){
    try{ window.localStorage.setItem(key, JSON.stringify(obj)); }catch(e){ console.warn("localStorage set failed", e); }
  }

  /* ---------- State ---------- */
  var state = {
    apiKey: lsGet(LS_KEYS.apiKey, ""),
    model: lsGet(LS_KEYS.model, DEFAULT_MODEL) || DEFAULT_MODEL,
    darkMode: lsGet(LS_KEYS.darkMode, "false") === "true",
    sysPromptGlobal: lsGet(LS_KEYS.sysPromptGlobal, "You are Pragyanpath, a helpful, honest, and precise AI assistant."),
    chats: lsGetJSON(LS_KEYS.chats, []),
    currentChatId: lsGet(LS_KEYS.currentChatId, null),
    isStreaming: false
  };

  function uid(){ return "c_" + Date.now() + "_" + Math.random().toString(36).slice(2,8); }

  function ensureChat(){
    if(!state.chats.length){
      var c = { id: uid(), title: "New chat", messages: [], systemPrompt: "" };
      state.chats.unshift(c);
      state.currentChatId = c.id;
    }
    if(!state.chats.find(function(c){ return c.id === state.currentChatId; })){
      state.currentChatId = state.chats[0].id;
    }
  }
  ensureChat();

  function persistChats(){ lsSetJSON(LS_KEYS.chats, state.chats); lsSet(LS_KEYS.currentChatId, state.currentChatId); }
  function currentChat(){
    return state.chats.find(function(c){ return c.id === state.currentChatId; }) || state.chats[0];
  }

  /* ---------- DOM refs ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var el = {
    app: $("app"), loading: $("loading"),
    sidebar: $("sidebar"), sidebarBackdrop: $("sidebarBackdrop"),
    chatList: $("chatList"), newChatBtn: $("newChatBtn"),
    hamburgerBtn: $("hamburgerBtn"), closeSidebarBtn: $("closeSidebarBtn"),
    chatTitle: $("chatTitle"), modelLabel: $("modelLabel"),
    messages: $("messages"), messagesInner: $("messagesInner"),
    inputBox: $("inputBox"), sendBtn: $("sendBtn"), apiKeyWarning: $("apiKeyWarning"),
    darkToggleBtn: $("darkToggleBtn"),
    openSettingsBtn: $("openSettingsBtn"), settingsModal: $("settingsModal"),
    apiKeyInput: $("apiKeyInput"), modelInput: $("modelInput"),
    saveSettingsBtn: $("saveSettingsBtn"), cancelSettingsBtn: $("cancelSettingsBtn"), closeSettingsBtn: $("closeSettingsBtn"),
    sysPromptBtn: $("sysPromptBtn"), sysPromptModal: $("sysPromptModal"),
    sysPromptGlobalInput: $("sysPromptGlobalInput"), sysPromptChatInput: $("sysPromptChatInput"),
    saveSysPromptBtn: $("saveSysPromptBtn"), cancelSysPromptBtn: $("cancelSysPromptBtn"), closeSysPromptBtn: $("closeSysPromptBtn"),
    renameModal: $("renameModal"), renameInput: $("renameInput"),
    saveRenameBtn: $("saveRenameBtn"), cancelRenameBtn: $("cancelRenameBtn")
  };
  var renameTargetId = null;

  /* ---------- Markdown rendering ---------- */
  function renderMarkdown(text){
    try{
      if(window.marked && typeof window.marked.parse === "function"){
        return window.marked.parse(text || "");
      }
    }catch(e){ console.warn("markdown parse failed", e); }
    var d = document.createElement("div");
    d.innerText = text || "";
    return d.innerHTML;
  }

  function enhanceCodeBlocks(container){
    if(!container) return;
    var pres = container.querySelectorAll("pre");
    pres.forEach(function(pre){
      if(pre.dataset.enhanced) return;
      pre.dataset.enhanced = "1";
      pre.style.position = "relative";
      var btn = document.createElement("button");
      btn.className = "code-copy-btn";
      btn.type = "button";
      btn.innerText = "Copy";
      btn.addEventListener("click", function(){
        var codeEl = pre.querySelector("code") || pre;
        var text = codeEl.innerText || "";
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){
            btn.innerText = "Copied!";
            setTimeout(function(){ btn.innerText = "Copy"; }, 1200);
          }).catch(function(){ btn.innerText = "Failed"; });
        }
      });
      pre.appendChild(btn);
    });
  }

  /* ---------- Rendering ---------- */
  function renderSidebar(){
    el.chatList.innerHTML = "";
    state.chats.forEach(function(chat){
      var item = document.createElement("div");
      item.className = "chat-item group flex items-center gap-1 px-2.5 py-2 rounded-lg cursor-pointer text-sm" +
        (chat.id === state.currentChatId ? " active" : "");
      var titleSpan = document.createElement("span");
      titleSpan.className = "flex-1 truncate";
      titleSpan.innerText = chat.title || "New chat";
      item.appendChild(titleSpan);

      var actions = document.createElement("div");
      actions.className = "hidden group-hover:flex items-center gap-1 shrink-0";

      var renameBtn = document.createElement("button");
      renameBtn.innerText = "✎";
      renameBtn.title = "Rename";
      renameBtn.className = "text-xs px-1.5 py-0.5 rounded";
      renameBtn.style.color = "var(--text-dim)";
      renameBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        openRenameModal(chat.id);
      });

      var delBtn = document.createElement("button");
      delBtn.innerText = "🗑";
      delBtn.title = "Delete";
      delBtn.className = "text-xs px-1.5 py-0.5 rounded";
      delBtn.style.color = "var(--text-dim)";
      delBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        deleteChat(chat.id);
      });

      actions.appendChild(renameBtn);
      actions.appendChild(delBtn);
      item.appendChild(actions);

      item.addEventListener("click", function(){
        state.currentChatId = chat.id;
        persistChats();
        renderAll();
        closeSidebarMobile();
      });

      el.chatList.appendChild(item);
    });
  }

  function messageBubble(role, content, isStreamingMsg){
    var wrap = document.createElement("div");
    wrap.className = "flex " + (role === "user" ? "justify-end" : "justify-start");

    var inner = document.createElement("div");
    inner.className = (role === "user")
      ? "msg-bubble-user px-4 py-2.5 max-w-[85%] text-sm msg-content"
      : "max-w-[95%] text-sm msg-content";

    inner.innerHTML = renderMarkdown(content || "");
    if(isStreamingMsg) inner.classList.add("cursor-blink");
    wrap.appendChild(inner);
    return { wrap: wrap, inner: inner };
  }

  function renderMessages(){
    var chat = currentChat();
    el.messagesInner.innerHTML = "";
    if(!chat.messages.length){
      var empty = document.createElement("div");
      empty.className = "text-center py-16";
      empty.style.color = "var(--text-dim)";
      empty.innerHTML = "<div class='text-lg font-medium mb-1' style='color:var(--text)'>Pragyanpath</div><div class='text-sm'>Ask me anything to get started.</div>";
      el.messagesInner.appendChild(empty);
      return;
    }
    chat.messages.forEach(function(m){
      var b = messageBubble(m.role, m.content, false);
      el.messagesInner.appendChild(b.wrap);
      enhanceCodeBlocks(b.inner);
    });
    scrollToBottom();
  }

  function scrollToBottom(){
    requestAnimationFrame(function(){
      el.messages.scrollTop = el.messages.scrollHeight;
    });
  }

  function renderHeader(){
    var chat = currentChat();
    el.chatTitle.innerText = chat.title || "New chat";
    el.modelLabel.innerText = state.model || DEFAULT_MODEL;
  }

  function renderApiKeyWarning(){
    el.apiKeyWarning.classList.toggle("hidden", !!state.apiKey);
  }

  function applyDarkMode(){
    document.documentElement.classList.toggle("dark", !!state.darkMode);
    el.darkToggleBtn.innerText = state.darkMode ? "☀" : "🌙";
  }

  function renderAll(){
    renderSidebar();
    renderMessages();
    renderHeader();
    renderApiKeyWarning();
  }

  /* ---------- Sidebar mobile toggle ---------- */
  function openSidebarMobile(){
    el.sidebar.classList.add("open");
    el.sidebarBackdrop.classList.remove("hidden");
  }
  function closeSidebarMobile(){
    el.sidebar.classList.remove("open");
    el.sidebarBackdrop.classList.add("hidden");
  }

  /* ---------- Chat management ---------- */
  function newChat(){
    var c = { id: uid(), title: "New chat", messages: [], systemPrompt: "" };
    state.chats.unshift(c);
    state.currentChatId = c.id;
    persistChats();
    renderAll();
    closeSidebarMobile();
    el.inputBox.focus();
  }

  function deleteChat(chatId){
    if(!window.confirm("Delete this chat? This cannot be undone.")) return;
    state.chats = state.chats.filter(function(c){ return c.id !== chatId; });
    if(!state.chats.length){
      var c = { id: uid(), title: "New chat", messages: [], systemPrompt: "" };
      state.chats.push(c);
    }
    if(state.currentChatId === chatId){
      state.currentChatId = state.chats[0].id;
    }
    persistChats();
    renderAll();
  }

  function openRenameModal(chatId){
    renameTargetId = chatId;
    var chat = state.chats.find(function(c){ return c.id === chatId; });
    el.renameInput.value = chat ? chat.title : "";
    showModal(el.renameModal);
    setTimeout(function(){ el.renameInput.focus(); el.renameInput.select(); }, 50);
  }

  function autoTitleFromText(text){
    var t = (text || "").trim().replace(/\s+/g, " ");
    if(t.length > 42) t = t.slice(0, 42) + "…";
    return t || "New chat";
  }

  /* ---------- Modals ---------- */
  function showModal(modal){ modal.classList.remove("hidden"); modal.classList.add("flex"); }
  function hideModal(modal){ modal.classList.add("hidden"); modal.classList.remove("flex"); }

  /* ---------- Settings ---------- */
  function openSettings(){
    el.apiKeyInput.value = state.apiKey || "";
    el.modelInput.value = state.model || DEFAULT_MODEL;
    showModal(el.settingsModal);
  }
  function saveSettings(){
    state.apiKey = (el.apiKeyInput.value || "").trim();
    state.model = (el.modelInput.value || "").trim() || DEFAULT_MODEL;
    lsSet(LS_KEYS.apiKey, state.apiKey);
    lsSet(LS_KEYS.model, state.model);
    renderHeader();
    renderApiKeyWarning();
    hideModal(el.settingsModal);
  }

  /* ---------- System prompt ---------- */
  function openSysPrompt(){
    var chat = currentChat();
    el.sysPromptGlobalInput.value = state.sysPromptGlobal || "";
    el.sysPromptChatInput.value = chat.systemPrompt || "";
    showModal(el.sysPromptModal);
  }
  function saveSysPrompt(){
    state.sysPromptGlobal = el.sysPromptGlobalInput.value || "";
    lsSet(LS_KEYS.sysPromptGlobal, state.sysPromptGlobal);
    var chat = currentChat();
    chat.systemPrompt = el.sysPromptChatInput.value || "";
    persistChats();
    hideModal(el.sysPromptModal);
  }

  /* ---------- Sending messages / streaming ---------- */
  function autoGrowTextarea(){
    el.inputBox.style.height = "auto";
    el.inputBox.style.height = Math.min(el.inputBox.scrollHeight, 160) + "px";
  }

  function setSendingState(isSending){
    state.isStreaming = isSending;
    el.sendBtn.disabled = isSending;
    el.sendBtn.innerText = isSending ? "Stop" : "Send";
    el.sendBtn.style.opacity = isSending ? "0.6" : "1";
  }

  async function handleSend(){
    if(state.isStreaming) return;
    var text = (el.inputBox.value || "").trim();
    if(!text) return;

    if(!state.apiKey){
      openSettings();
      return;
    }

    var chat = currentChat();
    if(!chat.messages.length){
      chat.title = autoTitleFromText(text);
    }
    chat.messages.push({ role: "user", content: text });
    el.inputBox.value = "";
    autoGrowTextarea();
    persistChats();
    renderAll();

    var effectiveSystemPrompt = (chat.systemPrompt && chat.systemPrompt.trim())
      ? chat.systemPrompt
      : state.sysPromptGlobal;

    var apiMessages = [];
    if(effectiveSystemPrompt && effectiveSystemPrompt.trim()){
      apiMessages.push({ role: "system", content: effectiveSystemPrompt });
    }
    chat.messages.forEach(function(m){ apiMessages.push({ role: m.role, content: m.content }); });

    // Placeholder assistant bubble for streaming
    var placeholder = messageBubble("assistant", "", true);
    el.messagesInner.appendChild(placeholder.wrap);
    scrollToBottom();

    setSendingState(true);
    var assistantText = "";

    try{
      var res = await fetch(OPENROUTER_URL, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + state.apiKey,
          "Content-Type": "application/json",
          "HTTP-Referer": (typeof location !== "undefined" ? location.href : ""),
          "X-Title": "Pragyanpath"
        },
        body: JSON.stringify({
          model: state.model || DEFAULT_MODEL,
          messages: apiMessages,
          stream: true
        })
      });

      if(!res.ok || !res.body){
        var errText = "";
        try{ errText = await res.text(); }catch(e){}
        throw new Error("Request failed (" + res.status + "). " + (errText ? errText.slice(0,300) : ""));
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      while(true){
        var chunk = await reader.read();
        if(chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        var lines = buffer.split("\n");
        buffer = lines.pop();

        for(var i = 0; i < lines.length; i++){
          var line = lines[i].trim();
          if(!line || line.indexOf("data:") !== 0) continue;
          var payload = line.slice(5).trim();
          if(payload === "[DONE]") continue;
          try{
            var json = JSON.parse(payload);
            var delta = json && json.choices && json.choices[0] && json.choices[0].delta
              ? json.choices[0].delta.content : null;
            if(delta){
              assistantText += delta;
              placeholder.inner.innerHTML = renderMarkdown(assistantText);
              enhanceCodeBlocks(placeholder.inner);
              scrollToBottom();
            }
          }catch(parseErr){ /* ignore malformed SSE chunk */ }
        }
      }

      if(!assistantText){
        assistantText = "_(No response received from the model. Please check your API key, model name, and OpenRouter account credits.)_";
        placeholder.inner.innerHTML = renderMarkdown(assistantText);
      }

    }catch(err){
      console.error("OpenRouter request failed", err);
      assistantText = "**Something went wrong.**\n\n" + (err && err.message ? err.message : "Unknown error. Please check your API key and internet connection.");
      placeholder.inner.innerHTML = renderMarkdown(assistantText);
    } finally {
      placeholder.inner.classList.remove("cursor-blink");
      chat.messages.push({ role: "assistant", content: assistantText });
      persistChats();
      setSendingState(false);
      scrollToBottom();
    }
  }

  /* ---------- Event wiring ---------- */
  function wireEvents(){
    el.newChatBtn.addEventListener("click", newChat);
    el.hamburgerBtn.addEventListener("click", openSidebarMobile);
    el.closeSidebarBtn.addEventListener("click", closeSidebarMobile);
    el.sidebarBackdrop.addEventListener("click", closeSidebarMobile);

    el.sendBtn.addEventListener("click", handleSend);
    el.inputBox.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        handleSend();
      }
    });
    el.inputBox.addEventListener("input", autoGrowTextarea);

    el.darkToggleBtn.addEventListener("click", function(){
      state.darkMode = !state.darkMode;
      lsSet(LS_KEYS.darkMode, String(state.darkMode));
      applyDarkMode();
    });

    el.openSettingsBtn.addEventListener("click", openSettings);
    el.closeSettingsBtn.addEventListener("click", function(){ hideModal(el.settingsModal); });
    el.cancelSettingsBtn.addEventListener("click", function(){ hideModal(el.settingsModal); });
    el.saveSettingsBtn.addEventListener("click", saveSettings);

    el.sysPromptBtn.addEventListener("click", openSysPrompt);
    el.closeSysPromptBtn.addEventListener("click", function(){ hideModal(el.sysPromptModal); });
    el.cancelSysPromptBtn.addEventListener("click", function(){ hideModal(el.sysPromptModal); });
    el.saveSysPromptBtn.addEventListener("click", saveSysPrompt);

    el.cancelRenameBtn.addEventListener("click", function(){ hideModal(el.renameModal); });
    el.saveRenameBtn.addEventListener("click", function(){
      if(!renameTargetId) return;
      var chat = state.chats.find(function(c){ return c.id === renameTargetId; });
      if(chat){
        chat.title = (el.renameInput.value || "").trim() || "New chat";
        persistChats();
        renderAll();
      }
      hideModal(el.renameModal);
    });
    el.renameInput.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); el.saveRenameBtn.click(); }
    });

    [el.settingsModal, el.sysPromptModal, el.renameModal].forEach(function(modal){
      modal.addEventListener("click", function(e){
        if(e.target === modal) hideModal(modal);
      });
    });

    window.addEventListener("resize", function(){
      if(window.innerWidth >= 768) closeSidebarMobile();
    });
  }

  /* ---------- Init ---------- */
  function init(){
    try{
      applyDarkMode();
      wireEvents();
      renderAll();
      autoGrowTextarea();
    }catch(e){
      console.error("Pragyanpath failed to initialize", e);
    } finally {
      var loadingEl = document.getElementById("loading");
      var appEl = document.getElementById("app");
      if(loadingEl) loadingEl.style.display = "none";
      if(appEl){ appEl.style.display = "flex"; appEl.classList.remove("hidden"); }
    }
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
