<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pragyanpath - AI Interface</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        gray: {
                            50: '#f9fafb',
                            100: '#f3f4f6',
                            200: '#e5e7eb',
                            700: '#374151',
                            800: '#1f2937',
                            900: '#111827',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base reset & natural scroll setup */
        body { margin: 0; padding: 0; }
        
        /* Markdown Rendering Styles */
        .markdown-body { font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; }
        .markdown-body p { margin-bottom: 0.75rem; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre { 
            background-color: #1f2937; color: #f8fafc; padding: 1rem; 
            border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; 
            font-size: 0.85rem; border: 1px solid #374151;
        }
        .markdown-body code { 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            background-color: rgba(175, 184, 193, 0.2); padding: 0.2em 0.4em; 
            border-radius: 0.25rem; font-size: 0.85em; 
        }
        .markdown-body pre code { background: none; padding: 0; border: none; font-size: 1em; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body a { color: #3b82f6; text-decoration: underline; }
        .dark .markdown-body code { background-color: rgba(255, 255, 255, 0.15); }
        .markdown-body blockquote { border-left: 4px solid #e5e7eb; padding-left: 1rem; color: #6b7280; font-style: italic; }
        .dark .markdown-body blockquote { border-left-color: #4b5563; color: #9ca3af; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Loader Animation */
        .loader-dots div { animation-timing-function: cubic-bezier(0, 1, 1, 0); }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }

        /* Blink cursor */
        .typing-cursor::after { content: '▋'; display: inline-block; animation: blink 1s step-end infinite; margin-left: 2px; color: #3b82f6; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-200 antialiased min-h-[100dvh] flex flex-col">

    <div id="loading" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white dark:bg-gray-900">
        <div class="loader-dots relative w-20 h-5 mb-4">
            <div class="absolute top-0 w-3 h-3 rounded-full bg-blue-500"></div>
            <div class="absolute top-0 w-3 h-3 rounded-full bg-blue-500"></div>
            <div class="absolute top-0 w-3 h-3 rounded-full bg-blue-500"></div>
            <div class="absolute top-0 w-3 h-3 rounded-full bg-blue-500"></div>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Initializing Pragyanpath...</p>
    </div>

    <div id="app" class="hidden flex-1 w-full flex relative min-h-[100dvh]">
        
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar()"></div>

        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 transform -translate-x-full md:translate-x-0 md:sticky md:top-0 h-[100dvh] flex flex-col transition-transform duration-300 ease-in-out shadow-xl md:shadow-none">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h1 class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-500 bg-clip-text text-transparent">Pragyanpath</h1>
                <button onclick="toggleSidebar()" class="md:hidden text-gray-500 hover:text-gray-800 dark:hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-3">
                <button onclick="createNewChat()" class="w-full flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg transition-colors font-medium text-sm shadow-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                    New Chat
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="chat-list">
                </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0 min-h-[100dvh] relative">
            
            <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-lg transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                    </button>
                    <span id="current-chat-title" class="font-medium text-gray-800 dark:text-gray-200 truncate max-w-[200px] md:max-w-md">New Chat</span>
                </div>
                
                <div class="flex items-center gap-2">
                    <button onclick="toggleTheme()" class="text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-lg transition-colors" title="Toggle Dark Mode">
                        <svg id="theme-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
                    </button>
                    <button onclick="toggleSettings()" class="text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 p-2 rounded-lg transition-colors" title="Settings">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </button>
                </div>
            </header>

            <div id="chat-window" class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-6 flex flex-col gap-6 pb-40">
                </div>

            <div class="sticky bottom-0 z-30 bg-gradient-to-t from-white via-white dark:from-gray-900 dark:via-gray-900 pt-8 pb-4 px-4 w-full">
                <div class="max-w-4xl mx-auto relative rounded-2xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm focus-within:ring-2 focus-within:ring-blue-500/50 transition-all">
                    <textarea id="chat-input" rows="1" class="w-full bg-transparent text-gray-900 dark:text-white px-4 py-3.5 pr-12 focus:outline-none resize-none max-h-48 overflow-y-auto placeholder-gray-500 dark:placeholder-gray-400 rounded-2xl" placeholder="Message Pragyanpath..."></textarea>
                    <button id="send-btn" onclick="handleSend()" class="absolute right-2 bottom-2 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center h-10 w-10">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                    </button>
                </div>
                <div class="text-center mt-2 text-xs text-gray-400 dark:text-gray-500">
                    AI can make mistakes. Verify important information.
                </div>
            </div>
        </main>
    </div>

    <div id="settings-modal" class="fixed inset-0 z-[100] bg-black/60 hidden backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-200" id="settings-content">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
                <h2 class="text-lg font-semibold text-gray-800 dark:text-white">Settings</h2>
                <button onclick="toggleSettings()" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="api-key-input" class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-white" placeholder="sk-or-v1-...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Model Name</label>
                    <input type="text" id="model-input" class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-white" placeholder="deepseek/deepseek-r1:free">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Global System Prompt</label>
                    <textarea id="system-prompt-input" rows="3" class="w-full px-3 py-2 bg-white dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-white resize-none" placeholder="You are Pragyanpath, a helpful AI assistant..."></textarea>
                </div>
            </div>
            <div class="px-6 py-4 bg-gray-50 dark:bg-gray-800/50 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3">
                <button onclick="toggleSettings()" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors">Save Configurations</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <script>
        // --- SVG Icons ---
        const ICONS = {
            sun: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>`,
            moon: `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>`,
            trash: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>`,
            edit: `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>`,
            user: `<svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>`,
            ai: `<svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 24 24"><path d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z"></path></svg>`
        };

        // --- State Management ---
        let state = {
            apiKey: '',
            modelName: 'deepseek/deepseek-r1:free',
            systemPrompt: 'You are Pragyanpath, a helpful, precise, and concise AI assistant.',
            isDark: false,
            chats: [],
            activeChatId: null,
            isGenerating: false
        };

        const STORAGE_KEY = 'pragyanpath_state';

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                }
            } catch (e) {
                console.error("Failed to load state", e);
            }
            
            // Check system preference if no theme saved
            if (localStorage.getItem(STORAGE_KEY) === null) {
                state.isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            loadState();
            applyTheme();
            
            if (state.chats.length === 0) {
                createNewChat(false); // don't render yet
            } else if (!state.activeChatId || !state.chats.find(c => c.id === state.activeChatId)) {
                state.activeChatId = state.chats[0].id;
            }

            // Reveal App & Hide Loader securely
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                const appEl = document.getElementById('app');
                appEl.classList.remove('hidden');
                
                renderSidebar();
                renderActiveChat();
                setupEventListeners();
                
                // Prompt for API key if empty
                if (!state.apiKey) toggleSettings();
            }, 500); // Slight delay ensures styles map correctly
        });

        // --- UI & Event Listeners ---
        function setupEventListeners() {
            const input = document.getElementById('chat-input');
            
            // Auto-resize textarea
            input.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.value === '') this.style.height = 'auto';
                
                // Enable/disable send btn
                document.getElementById('send-btn').disabled = this.value.trim() === '' || state.isGenerating;
            });

            // Enter to send (Shift+Enter for newline)
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!state.isGenerating && this.value.trim() !== '') {
                        handleSend();
                    }
                }
            });
        }

        // --- Theme ---
        function applyTheme() {
            if (state.isDark) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerHTML = ICONS.sun;
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerHTML = ICONS.moon;
            }
        }

        function toggleTheme() {
            state.isDark = !state.isDark;
            applyTheme();
            saveState();
        }

        // --- Sidebar (Mobile) ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // --- Settings Modal ---
        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            const content = document.getElementById('settings-content');
            
            if (modal.classList.contains('hidden')) {
                // Populate fields
                document.getElementById('api-key-input').value = state.apiKey;
                document.getElementById('model-input').value = state.modelName;
                document.getElementById('system-prompt-input').value = state.systemPrompt;
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.add('opacity-100');
                    content.classList.remove('scale-95');
                }, 10);
            } else {
                modal.classList.remove('opacity-100');
                content.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 200);
            }
        }

        function saveSettings() {
            const key = document.getElementById('api-key-input').value.trim();
            if(!key) {
                alert("API Key is required to function.");
                return;
            }
            state.apiKey = key;
            state.modelName = document.getElementById('model-input').value.trim() || 'deepseek/deepseek-r1:free';
            state.systemPrompt = document.getElementById('system-prompt-input').value.trim();
            saveState();
            toggleSettings();
        }

        // --- Chat Management ---
        function createNewChat(shouldRender = true) {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: []
            };
            state.chats.unshift(newChat);
            state.activeChatId = newChat.id;
            saveState();
            
            if (shouldRender) {
                renderSidebar();
                renderActiveChat();
                if(window.innerWidth < 768) toggleSidebar(); // Close sidebar on mobile
            }
        }

        function switchChat(id) {
            if(state.isGenerating) return;
            state.activeChatId = id;
            renderSidebar();
            renderActiveChat();
            if(window.innerWidth < 768) toggleSidebar();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            if(state.isGenerating) return;
            
            if(confirm("Are you sure you want to delete this chat?")) {
                state.chats = state.chats.filter(c => c.id !== id);
                if (state.chats.length === 0) createNewChat(false);
                if (state.activeChatId === id) state.activeChatId = state.chats[0].id;
                
                saveState();
                renderSidebar();
                renderActiveChat();
            }
        }

        function renameChat(e, id) {
            e.stopPropagation();
            const chat = state.chats.find(c => c.id === id);
            if(!chat) return;
            
            const newTitle = prompt("Enter new chat title:", chat.title);
            if(newTitle && newTitle.trim() !== '') {
                chat.title = newTitle.trim();
                saveState();
                renderSidebar();
                
                if (state.activeChatId === id) {
                    document.getElementById('current-chat-title').innerText = chat.title;
                }
            }
        }

        function renderSidebar() {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            state.chats.forEach(chat => {
                const isActive = chat.id === state.activeChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between p-2 rounded-lg cursor-pointer transition-colors ${isActive ? 'bg-blue-100/50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'hover:bg-gray-200 dark:hover:bg-gray-700/50 text-gray-700 dark:text-gray-300'}`;
                div.onclick = () => switchChat(chat.id);
                
                div.innerHTML = `
                    <div class="truncate text-sm font-medium flex-1 pr-2">${escapeHTML(chat.title)}</div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="renameChat(event, '${chat.id}')" class="p-1 hover:text-blue-500 transition-colors" title="Rename">${ICONS.edit}</button>
                        <button onclick="deleteChat(event, '${chat.id}')" class="p-1 hover:text-red-500 transition-colors" title="Delete">${ICONS.trash}</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function renderActiveChat() {
            const chat = state.chats.find(c => c.id === state.activeChatId);
            document.getElementById('current-chat-title').innerText = chat ? chat.title : 'Chat';
            
            const windowEl = document.getElementById('chat-window');
            windowEl.innerHTML = '';
            
            if (!chat || chat.messages.length === 0) {
                windowEl.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center text-center opacity-50 mt-20">
                        <div class="w-16 h-16 mb-4 bg-gray-200 dark:bg-gray-800 rounded-full flex items-center justify-center text-3xl">👋</div>
                        <h2 class="text-2xl font-semibold mb-2">Hello, I'm Pragyanpath.</h2>
                        <p class="max-w-md text-sm">How can I help you today? Type a message below to start the conversation.</p>
                    </div>
                `;
                return;
            }

            chat.messages.forEach(msg => {
                appendMessageToDOM(msg.role, msg.content, false);
            });
            
            scrollToBottom();
        }

        // --- Message Handling & Rendering ---
        function appendMessageToDOM(role, content, isStreaming = false) {
            const windowEl = document.getElementById('chat-window');
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            const innerDiv = document.createElement('div');
            innerDiv.className = `max-w-[85%] md:max-w-[75%] flex gap-3 ${role === 'user' ? 'flex-row-reverse' : 'flex-row'}`;
            
            // Avatar
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 flex-shrink-0 rounded-full flex items-center justify-center border shadow-sm ${
                role === 'user' 
                ? 'bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700' 
                : 'bg-blue-50 dark:bg-blue-900/30 border-blue-100 dark:border-blue-800'
            }`;
            avatar.innerHTML = role === 'user' ? ICONS.user : ICONS.ai;
            
            // Content Bubble
            const bubble = document.createElement('div');
            bubble.className = `px-4 py-3 rounded-2xl ${
                role === 'user'
                ? 'bg-blue-600 text-white rounded-tr-sm'
                : 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 shadow-sm rounded-tl-sm w-full'
            }`;
            
            // ID for streaming injection
            if (isStreaming) {
                bubble.id = 'streaming-content';
                bubble.className += ' typing-cursor'; // CSS class for blink effect
            }
            
            if (role === 'user') {
                bubble.innerText = content; // pure text for user
            } else {
                // Parse markdown securely using DOMPurify + Marked
                bubble.innerHTML = isStreaming ? '' : renderMarkdown(content);
                bubble.classList.add('markdown-body');
            }

            innerDiv.appendChild(avatar);
            innerDiv.appendChild(bubble);
            wrapper.appendChild(innerDiv);
            windowEl.appendChild(wrapper);
            
            // Remove initial empty state if present
            const emptyState = windowEl.querySelector('.mt-20');
            if (emptyState) emptyState.remove();

            scrollToBottom();
        }

        function renderMarkdown(rawText) {
            if (!rawText) return '';
            try {
                const parsed = marked.parse(rawText);
                return DOMPurify.sanitize(parsed);
            } catch (e) {
                console.error("Markdown parsing error", e);
                return escapeHTML(rawText);
            }
        }

        function scrollToBottom() {
            const main = document.querySelector('main');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // --- Core API Interaction ---
        async function handleSend() {
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text || state.isGenerating) return;

            if (!state.apiKey) {
                alert("Please configure your OpenRouter API Key in Settings first.");
                toggleSettings();
                return;
            }

            // Lock UI
            state.isGenerating = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            document.getElementById('send-btn').disabled = true;

            const chat = state.chats.find(c => c.id === state.activeChatId);
            
            // Add User Message
            const userMsg = { role: 'user', content: text };
            chat.messages.push(userMsg);
            appendMessageToDOM('user', text, false);

            // Auto-generate title if first message
            if (chat.messages.length === 1) {
                chat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                renderSidebar();
                document.getElementById('current-chat-title').innerText = chat.title;
            }

            // Prep AI empty bubble for streaming
            appendMessageToDOM('assistant', '', true);
            
            // Build Context for API
            const apiMessages = chat.messages.map(m => ({ role: m.role, content: m.content }));
            if (state.systemPrompt) {
                apiMessages.unshift({ role: 'system', content: state.systemPrompt });
            }

            try {
                await streamOpenRouterResponse(apiMessages, 
                    (chunkText) => {
                        // On Chunk received
                        const bubble = document.getElementById('streaming-content');
                        if (bubble) {
                            bubble.innerHTML = renderMarkdown(chunkText);
                            scrollToBottom();
                        }
                    },
                    (finalText) => {
                        // On Complete
                        const bubble = document.getElementById('streaming-content');
                        if (bubble) {
                            bubble.innerHTML = renderMarkdown(finalText);
                            bubble.classList.remove('typing-cursor');
                            bubble.removeAttribute('id');
                        }
                        chat.messages.push({ role: 'assistant', content: finalText });
                        saveState();
                        finishGeneration();
                    }
                );
            } catch (error) {
                console.error(error);
                const bubble = document.getElementById('streaming-content');
                if (bubble) {
                    bubble.innerHTML = `<span class="text-red-500 font-medium">Error: ${escapeHTML(error.message)}</span>`;
                    bubble.classList.remove('typing-cursor');
                    bubble.removeAttribute('id');
                }
                finishGeneration();
            }
        }

        function finishGeneration() {
            state.isGenerating = false;
            document.getElementById('send-btn').disabled = document.getElementById('chat-input').value.trim() === '';
            saveState();
        }

        // Stream logic
        async function streamOpenRouterResponse(messages, onChunk, onComplete) {
            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey}`
                },
                body: JSON.stringify({
                    model: state.modelName,
                    messages: messages,
                    stream: true
                })
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`API Error (${response.status}): ${errText}`);
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let accumulatedText = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split('\n').filter(line => line.trim() !== '');

                for (const line of lines) {
                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                        try {
                            const data = JSON.parse(line.slice(6));
                            const delta = data.choices[0]?.delta;
                            
                            // Support deepseek-reasoner <think> logic dynamically if present
                            if (delta?.content) {
                                accumulatedText += delta.content;
                                onChunk(accumulatedText);
                            } else if (delta?.reasoning_content) {
                                // optional rendering logic for reasoning engines
                                accumulatedText += delta.reasoning_content;
                                onChunk(accumulatedText);
                            }
                        } catch (e) {
                            // Ignorable partial parse errors from chunk fragmentation
                        }
                    }
                }
            }
            onComplete(accumulatedText);
        }

        // Utilities
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
